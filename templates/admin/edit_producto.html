{% extends 'admin/base_admin.html' %}
{% block content %}
<div class="container mt-4" style="max-width:720px;">
  <h3>Editar Producto</h3>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" name="nombre" value="{{ producto.nombre }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Subcategoría</label>
      <select class="form-select" name="id_subcategoria" required>
        {% for sub in subcategorias %}
        <option value="{{ sub.id_subcategoria }}" {% if sub.id_subcategoria == producto.id_subcategoria %}selected{% endif %}>{{ sub.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Imágenes actuales</label>
      {% if producto.imagenes %}
      <div class="row g-2 mb-2">
        {% for img in producto.imagenes %}
        <div class="col-md-4 col-6">
          <div class="card position-relative">
            {% if img.url.startswith('http') %}
            <img src="{{ img.url }}" class="card-img-top" alt="Imagen" style="max-height:150px; object-fit:cover;">
            {% else %}
            <img src="{{ url_for('static', filename='img/' + img.url) }}" class="card-img-top" alt="Imagen" style="max-height:150px; object-fit:cover;">
            {% endif %}
            <div class="form-check m-2">
              <input class="form-check-input" type="checkbox" name="eliminar_imagen" value="{{ img.id_imagen }}" id="elim-img-{{ img.id_imagen }}">
              <label class="form-check-label small text-danger" for="elim-img-{{ img.id_imagen }}">Eliminar</label>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-muted small">No hay imágenes cargadas.</p>
      {% endif %}
    </div>
    <div class="mb-3">
      <label class="form-label">Agregar imágenes</label>
      <div class="row g-2">
        <div class="col-md-6">
          <input class="form-control" type="file" name="imagenes" accept="image/*" multiple>
        </div>
        <div class="col-md-6">
          <button type="button" class="btn btn-outline-primary w-100"
            onclick="openCloudinarySelector({mode:'image', targetInput: this.closest('form').querySelector('[name=cloudinary_ids]'), displayTarget: 'cloudinaryPreview'})">
            <i class="fas fa-cloud me-1"></i> Elegir de Cloudinary
          </button>
          <div id="cloudinaryPreview" class="mt-1"></div>
          <input type="hidden" name="cloudinary_ids" value="">
        </div>
      </div>
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-link" href="{{ url_for('admin_dashboard') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
