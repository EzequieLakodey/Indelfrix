{% extends 'admin/base_admin.html' %}
{% block content %}
<div class="container mt-4" style="max-width:720px;">
  <h3>Nuevo Producto</h3>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Nombre <span class="text-muted fw-normal">(opcional — se infiere de subcategoría + HP)</span></label>
      <input class="form-control" name="nombre" placeholder="Ej: Unidad 2HP (grande)">
    </div>
    <div class="mb-3">
      <label class="form-label">Subcategoría</label>
      <select class="form-select" name="id_subcategoria" required>
        <option value="">-- Seleccionar subcategoría --</option>
        {% for sub in subcategorias %}
        <option value="{{ sub.id_subcategoria }}">{{ sub.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    {% include 'admin/_producto_specs.html' %}
    <div class="mb-3">
      <label class="form-label">Imágenes</label>
      <div class="row g-2">
        <div class="col-md-6">
          <input class="form-control" type="file" name="imagenes" accept="image/*" multiple>
          <div class="form-text">Subir desde este dispositivo.</div>
        </div>
        <div class="col-md-6">
          <button type="button" class="btn btn-outline-primary w-100"
            onclick="openCloudinarySelector({mode:'image', targetInput: this.closest('form').querySelector('[name=cloudinary_ids]'), displayTarget: 'cloudinaryPreview'})">
            <i class="fas fa-cloud me-1"></i> Elegir de Cloudinary
          </button>
          <div id="cloudinaryPreview" class="mt-1"></div>
          <input type="hidden" name="cloudinary_ids" value="">
        </div>
      </div>
    </div>
    <button class="btn btn-success">Crear</button>
    <a class="btn btn-link" href="{{ url_for('admin_dashboard') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
