{% extends 'admin/base_admin.html' %}
{% block content %}
<div class="container mt-4" style="max-width:720px;">
  <h3>Editar Categoría</h3>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" name="nombre" value="{{ categoria.nombre }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" name="descripcion">{{ categoria.descripcion }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Imágenes actuales</label>
      {% if categoria.imagenes %}
      <div class="row g-2 mb-2">
        {% for img in categoria.imagenes %}
        <div class="col-md-4 col-6">
          <div class="card position-relative">
            <img src="{{ img.url|cdn(300) }}" class="card-img-top" alt="Imagen"
                style="max-height:150px; object-fit:cover;" loading="lazy" decoding="async">
            <div class="form-check m-2">
              <input class="form-check-input" type="checkbox" name="eliminar_imagen" value="{{ img.id_imagen }}" id="elim-img-{{ img.id_imagen }}">
              <label class="form-check-label small text-danger" for="elim-img-{{ img.id_imagen }}">Eliminar</label>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-muted small">No hay imágenes cargadas.</p>
      {% endif %}
    </div>
    <div class="mb-3">
      <label class="form-label">Agregar nuevas imágenes</label>
      <input class="form-control" type="file" name="imagenes" accept="image/*" multiple>
      <div class="form-text">Podés seleccionar varias imágenes a la vez (Ctrl+click).</div>
    </div>
    <button class="btn btn-primary">Guardar</button>
  </form>
</div>
{% endblock %}
